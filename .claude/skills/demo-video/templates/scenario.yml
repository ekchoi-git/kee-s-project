name: product-demo
url: http://127.0.0.1:3000
viewport: { width: 1920, height: 1080 }
voice:
  mode: none # none | local | openai
  model: gpt-4o-mini-tts
  style: "차분하고 친근한 제품 소개 톤, 또렷한 한국어"
  # name: Microsoft SunHi Desktop # local일 때 선택 가능
  paddingMs: 700
chapters:
  - title: "대시보드 둘러보기"
    narration: "대시보드에서 오늘의 핵심 지표를 한눈에 확인할 수 있습니다."
    actions:
      - { do: goto, url: / }
      - { do: wait, ms: 700 }
      - { do: move, selector: "[data-demo=metrics]" }
      - { do: highlight, selector: "[data-demo=metrics]", label: "핵심 지표" }
  - title: "검색하고 저장하기"
    narration: "검색어를 입력하면 원하는 정보를 빠르게 찾아 저장할 수 있습니다."
    actions:
      - { do: click, selector: "input[type=search]" }
      - { do: type, text: "고객 피드백", delayMs: 95 }
      - { do: click, selector: "button[type=submit]" }
      - { do: wait, ms: 900 }
