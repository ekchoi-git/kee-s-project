name: celly-company-year-payment
mode: desktop
output: outputs/demo-video-hq
viewport:
  width: 1920
  height: 1080
voice:
  mode: none
durationLimitMs: null
recording:
  intervalMs: 250
  processingVisibleMaxMs: 5000
  captureBackend: ffmpeg-desktop
  requireLossless: true
windows:
  celly:
    titleRegex: ^셀리$
    appRegex: python(?:w)?\.exe$
    launch: never
  excel:
    titleRegex: ^거래내역_테스트용_500행(?:\.xlsx)? - Excel$
    appRegex: EXCEL
    launch: never
sourceWorkbook: C:/Users/user/Desktop/project/kee-s-project/거래내역_테스트용_500행.xlsx
design:
  background: '#FFFFFF'
  headerGradient:
  - '#173B94'
  - '#5795EF'
  captionGradient:
  - '#173B94'
  - '#4B8BE7'
  labels: blue-gradient
  applicationContent: actual-capture
  previewReference: C:/Users/user/.codex/generated_images/01a19af5-c5d7-7ea0-bac0-292310a06c11/exec-c84bf2bd-e007-4a0a-8cc5-0ab9b72bb9b0.png
  layout: 'scene-focused: Celly input/reply close-ups, Excel result close-up'
editing:
  opening:
    durationMs: 4000
    title: 셀리
    subtitle: Excel 작업을 말로 간편하게
  chapterCardMs: 2000
  ending:
    durationMs: 5000
    title: 반복되고 지겨운 Excel 작업, 셀리에게 말하세요.
  music: 신나지만 시끄럽지 않은 배경음
  clickEffects: true
  virtualCursor: true
  highlights:
  - 연결 상태
  - 입력창
  - 보내기
  - 작업 완료
  - 새 시트
  - 회사명 행
  - 연도 열
  - 지불금액 합계
  - 저장
  crf: 14
  layout: scene-focused
chapters:
- id: connect
  title: 연결 준비
  caption: 열린 Excel 파일을 셀리와 연결합니다.
  actions:
  - do: observe
    window: excel
    target: 원본 거래내역과 파일명 확인
  - do: observe
    window: celly
    target: 선택된 파일과 작업 시트 확인. API 키 창은 열지 않음
  - do: hold
    ms: 3000
- id: request
  title: 말로 요청하기
  caption: 회사별·연도별 지불금액을 말로 요청하세요.
  actions:
  - do: click
    window: celly
    target: 셀리에게 하고 싶은 일을 말로 적어주세요 입력창
  - do: type
    window: celly
    text: 연도별, 회사별 지불금액을 새로운 시트에 넣어줘. 행에는 회사명, 열에는 연도로 구성하면 돼.
  - do: hold
    ms: 2000
  - do: click
    window: celly
    target: 보내기
    beginRequest: true
  - do: wait_result
    window: celly
    visibleMaxMs: 5000
    timeoutMs: 180000
    readyRegex: ✔ (?:작업|적용) 완료
    errorRegex: ⚠ 일부만|오류가 발생|작업 실패
- id: result
  title: 결과 확인과 저장
  caption: 새 시트에서 회사별·연도별 지불금액 합계를 확인하세요.
  actions:
  - do: observe
    window: celly
    target: 이번 요청의 작업 완료와 변경 내용 확인
  - do: click
    window: excel
    target: 이번 요청으로 만들어진 새 시트 탭
  - do: observe
    window: excel
    target: 행=회사명, 열=연도, 값=지불금액 합계. 원본과 실제 합계 대조
  - do: hold
    ms: 6000
  - do: key
    window: excel
    key: Control_L+s
    target: 검증한 결과를 Excel에서 저장
  - do: observe
    window: excel
    target: 저장 완료. 대화상자가 뜨면 멈추고 확인
  - do: hold
    ms: 1500
